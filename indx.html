<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animação com JS e CSS</title>
    
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #F3F5F7;
            margin: 0;
        }

        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            cursor: pointer; 
            transition: all 0.3s ease;
        }


        @keyframes pulsarGirar {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.08) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .animando {
            animation: pulsarGirar 3s infinite ease-in-out;
        }
    </style>
</head>
<body>

    <img src="https://snack-code-uploads.s3.us-west-1.amazonaws.com/~asset/86875453d1bfc802cffd394383304396" 
         id="meu-avatar" 
         class="avatar" 
         alt="Perfil">

    <script>
        const avatarElement = document.getElementById('./meu-avatar.png');

        avatarElement.addEventListener('click', function() {
            
            avatarElement.classList.toggle('animando');
            
        });
    </script>

</body>
</html>
